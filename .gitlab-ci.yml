stages:
  - kernel
  - test
  - build
  - validation-build
  - browser-test
  - deploy

browser-baseline:
  stage: test
  image: node:24.19.0-alpine
  before_script:
    - corepack enable
    - corepack install
    - pnpm install --frozen-lockfile
  needs:
    - job: rust-kernel
      artifacts: true
  script:
    - pnpm run typecheck
    - pnpm run test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

rust-kernel:
  stage: kernel
  image: rust:1.85.0-alpine3.20
  script:
    - rustup component add rustfmt
    - cargo fmt --manifest-path wasm/engine-rust/Cargo.toml -- --check
    - cargo test --locked --manifest-path wasm/engine-rust/Cargo.toml
    - rustup target add wasm32-unknown-unknown
    - cargo build --locked --manifest-path wasm/engine-rust/Cargo.toml --release --target wasm32-unknown-unknown
    - test -s wasm/engine-rust/target/wasm32-unknown-unknown/release/epi_info_table2x2.wasm
    - cp wasm/engine-rust/target/wasm32-unknown-unknown/release/epi_info_table2x2.wasm wasm/demo/epi2x2.wasm
    - sha256sum wasm/demo/epi2x2.wasm
  artifacts:
    paths:
      - wasm/demo/epi2x2.wasm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

production-build:
  stage: build
  image: node:24.19.0-alpine
  needs:
    - job: browser-baseline
      artifacts: false
    - job: rust-kernel
      artifacts: true
  before_script:
    - corepack enable
    - corepack install
    - pnpm install --frozen-lockfile
  script:
    - pnpm run build
    - pnpm run test:build
  artifacts:
    paths:
      - wasm/dist
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

validation-lab-build:
  stage: validation-build
  image: python:3.12-slim
  needs:
    - job: production-build
      artifacts: true
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - wasm/validation-lab/requirements.txt
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --requirement wasm/validation-lab/requirements.txt
  script:
    - python wasm/validation-lab/verify.py
    - jupyter lite build --lite-dir wasm/validation-lab --contents content --output-dir wasm/dist/validation-lab
    - test -f wasm/dist/validation-lab/lab/index.html
    - test -f wasm/dist/validation-lab/files/validate-table2x2.ipynb
    - test -f wasm/dist/validation-lab/files/validate-stratified2x2.ipynb
    - test -f wasm/dist/validation-lab/files/validate-frequency.ipynb
    - test -f wasm/dist/validation-lab/files/validate-means.ipynb
    - test -f wasm/dist/validation-lab/files/validate-rate.ipynb
    - test -f wasm/dist/validation-lab/files/validate-population-survey.ipynb
  artifacts:
    paths:
      - wasm/dist
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

browser-e2e:
  stage: browser-test
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  needs:
    - job: validation-lab-build
      artifacts: true
  before_script:
    - corepack enable
    - corepack install
    - pnpm install --frozen-lockfile
  script:
    - pnpm run test:browser
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report
      - test-results
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

pages:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: validation-lab-build
      artifacts: true
    - job: browser-e2e
      artifacts: false
  script:
    - test -f wasm/dist/index.html
    - mkdir -p public
    - cp -R wasm/dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
