name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Validate and compile the epidemiology kernel
        run: |
          cargo fmt --manifest-path wasm/engine-rust/Cargo.toml -- --check
          cargo test --locked --manifest-path wasm/engine-rust/Cargo.toml
          cargo build --locked --manifest-path wasm/engine-rust/Cargo.toml --release --target wasm32-unknown-unknown
          test -s wasm/engine-rust/target/wasm32-unknown-unknown/release/epi_info_table2x2.wasm
          cp wasm/engine-rust/target/wasm32-unknown-unknown/release/epi_info_table2x2.wasm wasm/demo/epi2x2.wasm
          sha256sum wasm/demo/epi2x2.wasm

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Install browser dependencies
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile

      - name: Validate and build the browser application
        run: pnpm run check

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the JupyterLite validation lab
        run: |
          python -m pip install --requirement wasm/validation-lab/requirements.txt
          python wasm/validation-lab/verify.py
          jupyter lite build --lite-dir wasm/validation-lab --contents content --output-dir wasm/dist/validation-lab
          test -f wasm/dist/validation-lab/lab/index.html
          test -f wasm/dist/validation-lab/files/validate-chi-square-trend.ipynb
          test -f wasm/dist/validation-lab/files/validate-tables.ipynb
          touch wasm/dist/.nojekyll

      - name: Run browser acceptance tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:browser

      - name: Configure Pages artifact
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: wasm/dist

  deploy:
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
